server {
    listen 80;
    server_name _;

    # Serve files from the React build output
    root /usr/share/nginx/html;
    index index.html;

    # WHY try_files $uri $uri/ /index.html?
    #   React Router handles navigation entirely in the browser.
    #   When a user visits /analyses or refreshes the page on any route,
    #   nginx looks for a matching file, then a matching folder, and if
    #   neither exists it falls back to /index.html — letting React Router
    #   take over and render the correct component.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets (JS, CSS, images) aggressively.
    # Vite hashes filenames on every build, so old filenames never collide.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Never cache index.html — it must always be fresh so the browser
    # gets the latest asset filenames after a new deployment.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
